[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat-session-sync"
dynamic = ["version"]
description = "Attach local AI-agent sessions to dedicated chat groups through cc-connect"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "agent-chat-session-sync contributors" }]
keywords = ["codex", "cc-connect", "feishu", "lark", "session-sync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
    "pywin32>=312 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Sanshix/agent-chat-session-sync"
Documentation = "https://github.com/Sanshix/agent-chat-session-sync#readme"
Repository = "https://github.com/Sanshix/agent-chat-session-sync.git"
Issues = "https://github.com/Sanshix/agent-chat-session-sync/issues"
Changelog = "https://github.com/Sanshix/agent-chat-session-sync/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
agent-chat-session-sync = "agent_chat_session_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "agent_chat_session_sync.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
