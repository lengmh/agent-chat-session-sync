name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests

  cc-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: ./scripts/build-cc-connect.sh
      - run: test -x dist/cc-connect

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: ACSS_BUILD_COMMIT="$(git rev-parse HEAD)" python -m build
      - run: python scripts/write-checksums.py dist
      - run: python scripts/verify-release-artifacts.py dist
      - name: Install and exercise wheel from artifact
        run: |
          python -m venv /tmp/acss-wheel
          /tmp/acss-wheel/bin/pip install dist/*.whl
          HOME=/tmp/acss-home CODEX_HOME=/tmp/acss-home/.codex CLAUDE_HOME=/tmp/acss-home/.claude /tmp/acss-wheel/bin/agent-chat-session-sync --version
          HOME=/tmp/acss-home CODEX_HOME=/tmp/acss-home/.codex CLAUDE_HOME=/tmp/acss-home/.claude /tmp/acss-wheel/bin/agent-chat-session-sync install-hooks
          HOME=/tmp/acss-home CODEX_HOME=/tmp/acss-home/.codex CLAUDE_HOME=/tmp/acss-home/.claude /tmp/acss-wheel/bin/agent-chat-session-sync uninstall-hooks
          /tmp/acss-wheel/bin/python -m unittest discover -s tests -v
      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/acss-sdist
          /tmp/acss-sdist/bin/pip install dist/*.tar.gz
          /tmp/acss-sdist/bin/agent-chat-session-sync --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
